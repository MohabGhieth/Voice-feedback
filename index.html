<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MG RESALE — Voice CRM</title>
<style>
body{margin:0;background:#f5f7f8;font-family:Arial,sans-serif;color:#102018}
.wrap{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
h1{margin:0 0 8px}.sub{color:#64748b;line-height:1.5}
button{border:0;border-radius:14px;padding:14px 18px;font-size:17px;font-weight:700;cursor:pointer}
#start{background:#22c55e;color:#fff;width:100%;margin-top:16px}#process{background:#111827;color:#fff;width:100%;margin-top:10px;display:none}
#status,#transcript{margin-top:14px;padding:12px;border-radius:12px;line-height:1.6}
#status{background:#eef2f7;min-height:48px}#transcript{background:#f8fafc;border:1px solid #e2e8f0;min-height:120px;white-space:pre-wrap}
.ok{background:#ecfdf5!important}.warn{background:#fff7ed!important}.err{background:#fef2f2!important}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>MG RESALE — Voice CRM</h1>
<div class="sub">اضغط Start Voice مرة واحدة واحكي الـ feedback كامل براحتك. بعد حوالي 3 ثواني من آخر كلام، الـ CRM يبدأ المعالجة. الأسئلة تأتي بعد انتهاء الـ feedback بالكامل.</div>
<button id="start">🎙 Start Voice</button><button id="process">⏹ Process Now</button>
<div id="status">Ready.</div><div id="transcript"></div>
</div></div>
<script>
const VOICE_API_URL='https://script.google.com/macros/s/AKfycbyawltTbaWy291FyF95S0GX6oIlnoac5FzDVxFdDSqUG3VyRoTItG4Mj8zZolxRN_GIjw/exec';
const SILENCE_MS=3000;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const startBtn=document.getElementById('start'),processBtn=document.getElementById('process'),statusEl=document.getElementById('status'),transcriptEl=document.getElementById('transcript');
let rec=null,keep=false,finalText='',interim='',timer=null,busy=false;

function status(t,c=''){statusEl.textContent=t;statusEl.className=c}
function render(){transcriptEl.textContent=(finalText+' '+interim).trim()}
function clearTimer(){if(timer)clearTimeout(timer);timer=null}
function speak(t){if(!('speechSynthesis'in window)||!t)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-EG';u.rate=1.05;speechSynthesis.speak(u)}
function arm(){clearTimer();timer=setTimeout(()=>{if(finalText.trim()){keep=false;try{rec.stop()}catch(e){}}},SILENCE_MS)}
function setup(){
 if(!SR){status('Speech Recognition غير مدعوم في المتصفح. استخدم Chrome/Android أو Safari/iPhone.','err');return false}
 rec=new SR();rec.lang='ar-EG';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
 rec.onstart=()=>status('اتكلم براحتك... مش هسألك أي سؤال لحد ما تخلص الـ feedback.');
 rec.onresult=e=>{interim='';for(let i=e.resultIndex;i<e.results.length;i++){let t=e.results[i][0].transcript||'';if(e.results[i].isFinal)finalText+=t+' ';else interim+=t}render();if(finalText.trim())arm()};
 rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){keep=false;status('المايك مرفوض. Allow Microphone للموقع ثم جرّب مرة أخرى.','err')}else if(e.error!=='aborted')status('Voice error: '+e.error,'err')};
 rec.onend=()=>{if(keep&&!busy){setTimeout(()=>{try{rec.start()}catch(e){}},150)}else if(!busy&&finalText.trim())send()};
 return true
}
async function mic(){
 if(!navigator.mediaDevices?.getUserMedia)return true;
 try{let s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());return true}
 catch(e){status('Allow Microphone للموقع من إعدادات المتصفح ثم اضغط Start Voice مرة أخرى.','err');return false}
}
async function start(){
 if(busy)return;if(!rec&&!setup())return;if(!(await mic()))return;
 finalText='';interim='';render();clearTimer();keep=true;processBtn.style.display='block';try{rec.start()}catch(e){}
}
function manual(){if(!finalText.trim())return;keep=false;clearTimer();try{rec.stop()}catch(e){}}
async function ask(q){
 status(q,'warn');speak(q);
 await new Promise(r=>{if(!('speechSynthesis'in window))return r();let x=setInterval(()=>{if(!speechSynthesis.speaking){clearInterval(x);r()}},80)});
 finalText='';interim='';render();clearTimer();keep=true;try{rec.start()}catch(e){}
}
async function send(){
 if(busy||!finalText.trim())return;busy=true;processBtn.disabled=true;startBtn.disabled=true;status('براجع الـ feedback كامل وبحلله...');
 try{
   let r=await fetch(VOICE_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({transcript:finalText.trim()})});
   let d=await r.json();await handle(d);
 }catch(e){status('لم أستطع الاتصال بالـ CRM. راجع آخر Deployment للـ Apps Script وتأكد أن الوصول Anyone.','err')}
 finally{busy=false;processBtn.disabled=false;startBtn.disabled=false}
}
async function handle(d){
 if(!d)return;
 if(d.success){keep=false;status(d.message||'Saved successfully.','ok');speak(d.message||'تم الحفظ بنجاح.');return}
 if(d.type==='REQUIRED_NEW_LEAD_DATA'||d.type==='NEW_CLIENT_MISSING_DATA'||d.type==='SOURCE_REQUIRED'||d.type==='CLIENT_NOT_FOUND'||d.type==='MULTIPLE_CLIENTS'){
   await ask(d.question||d.message);return
 }
 if(d.type==='LEAD_FIELD_CHANGE_CONFIRMATION'){await ask(d.message||'هل تريد تعديل بيانات العميل؟ قل عدل أو ضيف أو سيبها زي ما هي.');return}
 keep=false;status(d.message||'حدث خطأ.','err');speak(d.message||'حدث خطأ أثناء المعالجة.')
}
startBtn.onclick=start;processBtn.onclick=manual;
</script></body></html>
